<style>

.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}.stage-head{padding:14px 17px 12px;background:var(--bg);border-bottom:1px solid var(--line)}.stage-head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stage-head h2{font-size:15px;margin:0}.stage-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.decision{background:var(--bg);padding:9px 17px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}.decision b{font-weight:600;color:var(--blue)}.viewport{position:relative;overflow:hidden;flex:1;touch-action:none;background-image:radial-gradient(oklch(.82 .014 260) .8px,transparent .8px);background-size:16px 16px;cursor:grab}.viewport:active{cursor:grabbing}.world{position:absolute;transform-origin:0 0;left:0;top:0}.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:oklch(.72 .045 262);stroke-width:1.7}.edge.failure{stroke:oklch(.61 .08 25);stroke-dasharray:5 4}.edge.related{stroke:var(--blue);stroke-width:2.5}.edge.dim{opacity:.3}.edge-label{font:11px "Segoe UI",sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}.canvas-node{position:absolute;width:240px;height:124px;padding:13px 13px 10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer}.canvas-node:hover{background:var(--bg);border-color:oklch(.7 .11 262)}.canvas-node.selected{border:2px solid var(--blue);padding:12px 12px 9px}.canvas-node::before,.canvas-node::after{content:"";position:absolute;top:58px;width:7px;height:7px;border:1px solid var(--blue);border-radius:50%;background:var(--bg)}.canvas-node::before{left:-5px}.canvas-node::after{right:-5px}.node-top{display:flex;align-items:center;gap:8px}.icon{height:24px;width:24px;border-radius:6px;display:inline-flex;justify-content:center;align-items:center;background:var(--purple);color:white;font-size:12px;font-weight:700;flex:none}.icon.code{background:var(--blue)}.icon.knowledge-retrieval{background:var(--green)}.icon.answer,.icon.end{background:var(--orange)}.icon.start{background:var(--blue)}.icon.if-else,.icon.question-classifier,.icon.assigner,.icon.variable-aggregator{background:oklch(.47 .10 170)}.icon.agent{background:var(--purple)}.icon.tool{background:oklch(.47 .12 220)}.node-name{font-weight:600;line-height:1.4;font-size:13px;overflow-wrap:anywhere}.node-summary{font-size:11px;color:var(--muted);background:var(--panel);padding:4px 6px;margin-top:10px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-purpose{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-check{position:absolute;top:7px;right:7px;color:var(--green);font-size:11px}.canvas-foot{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 12px;background:var(--bg);border-top:1px solid var(--line);font-size:12px}.canvas-foot button{padding:4px 8px}.canvas-foot label{margin-left:auto;display:flex;gap:4px;align-items:center}.canvas-help{padding:5px 12px 8px;background:var(--bg);font-size:11px;color:var(--muted)}
.inspector{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}.inspect-title{padding:16px 18px 12px;display:flex;gap:9px;align-items:flex-start}.inspect-title h2{font-size:15px;margin:0;line-height:1.5;overflow-wrap:anywhere}.inspect-title .type{font-size:11px;color:var(--muted)}.status-line{padding:0 18px 10px;color:var(--muted);font-size:11px}.tabs{display:flex;padding:0 12px;border-bottom:1px solid var(--line);gap:4px}.tabs button{border:0;border-radius:0;padding:9px 7px;background:transparent;font-size:12px;white-space:nowrap}.tabs button[aria-selected=true]{color:var(--blue);border-bottom:2px solid var(--blue)}.inspect-body{overflow-y:auto;padding:16px 18px 24px;flex:1;min-height:0;scroll-behavior:auto}.inspect-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:12px}.inspect-foot label{display:flex;gap:5px;align-items:center;margin-right:auto}.block{margin:17px 0}.field-label{display:flex;gap:8px;align-items:center;font-weight:600;font-size:12px;margin:0 0 6px}.field-label button{margin-left:auto;font-size:11px;padding:3px 7px;font-weight:400}.valuebox{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:10px;overflow-wrap:anywhere}.codebox{max-height:480px;overflow:auto}.long-code{max-height:560px}.hint{font-size:12px;color:var(--muted);margin:6px 0 0}.step-list{padding-left:21px;margin:9px 0 15px}.step-list li{padding:4px 0;line-height:1.8;overflow-wrap:anywhere}.binding{display:flex;align-items:flex-start;gap:6px;margin:6px 0;font-size:12px}.binding code{color:var(--blue);font-size:11px}.binding button{font-size:11px;padding:2px 6px;text-align:left;overflow-wrap:anywhere}.quiet-note{background:var(--panel);padding:10px 12px;border-radius:6px;margin:11px 0;font-size:12px;line-height:1.8}.warning{color:var(--red)}table{width:100%;border-collapse:collapse;font-size:12px;margin:9px 0}th,td{text-align:left;vertical-align:top;padding:8px 5px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{font-weight:600;color:var(--muted)}td code{font-size:11px}.connect-row{display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.connect-row button{text-align:left;overflow-wrap:anywhere;flex:1}.sources a{display:block;padding:7px 0;font-size:12px}.reading .stage{grid-column:2/4;background:var(--bg);overflow-y:auto;display:block}.reading .inspector{display:none}.reading .stage-head{position:sticky;top:0;background:var(--bg);z-index:1}.reading-content{padding:20px 28px 60px;max-width:1020px;margin:auto}.reading-content h1{font-size:23px;margin:7px 0 13px}.reading-content h2{font-size:18px;margin-top:30px}.reading-content p{max-width:76ch}.reading-content .step-list{max-width:80ch}.reading-content .step-list li{margin:8px 0}.reading-content table{max-width:900px}.progress-text{color:var(--muted);font-size:12px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:7px;z-index:10;box-shadow:var(--shadow)}[hidden]{display:none!important}.empty{padding:15px;color:var(--muted);font-size:12px}.mobile-toggle{display:none}
@media(max-width:1150px){.shell{grid-template-columns:160px minmax(250px,1fr) 386px}.topbar{gap:11px}.brand small,.topmeta{display:none}.brand{font-size:21px}.inspect-body{padding:14px}.tabs{gap:0;padding:0 7px}.tabs button{padding:9px 5px}.offline{display:none}}

<body>
<header class="topbar"><div class="brand">D<i>ify</i><small>复刻学习手册</small></div><div class="title"><h1>课程智能学习助手</h1><div class="topmeta">先看连线，再照着填写每个节点</div></div><div class="topactions"><span class="offline">● 离线阅读 · 无模型调用</span><button class="print" id="print">打印当前内容</button><button class="primary" id="startGuide">从准备工作开始</button></div></header>
<div class="shell" id="shell">
<aside class="sidebar"><div class="app-name">🤖 完整课程学习闭环<small id="version"></small></div><div class="modes"><button id="canvasMode" class="active">画布与节点</button><button id="prepMode">搭建准备</button></div><nav class="chapter-list" id="chapters" aria-label="教程章节"></nav><div class="node-search"><input id="search" type="search" aria-label="搜索全部节点" placeholder="搜索节点、编号…"></div><div class="node-list" id="nodeList" aria-label="节点列表"></div><div class="sidebar-foot" id="progress">复刻进度仅保存在本机浏览器。</div></aside>
<main class="stage" id="stage"><div class="stage-head"><div class="row"><h2 id="chapterTitle"></h2><span class="progress-text" id="count"></span></div><p id="chapterSubtitle"></p></div><div class="decision" id="decision"></div><div class="viewport" id="viewport" aria-label="可拖动缩放的节点连接画布"><div class="world" id="world"><svg class="edges" id="edges" aria-label="节点连线"></svg><div id="nodes"></div></div></div><div class="canvas-foot"><button id="zoomOut" aria-label="缩小画布">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大画布">＋</button><button id="fit">适应画布</button><button id="actual">1:1</button><button id="locate">定位选中</button><label><input type="checkbox" id="failures" checked>显示异常连线</label></div><div class="canvas-help">拖空白处平移 · 滚轮缩放 · 点击节点查看配置 · 虚线为异常分支</div></main>
<aside class="inspector" id="inspector" aria-label="选中节点配置"><div class="inspect-title" id="inspectTitle"></div><div class="status-line">教学配置 · 依据本地方案与实际页面整理，待你逐支复测</div><div class="tabs" role="tablist" aria-label="节点详情"><button role="tab" data-tab="settings" aria-selected="true">设置</button><button role="tab" data-tab="io" aria-selected="false">输入 / 输出</button><button role="tab" data-tab="connections" aria-selected="false">连线</button><button role="tab" data-tab="pm" aria-selected="false">产品思考</button><button role="tab" data-tab="raw" aria-selected="false">完整参数</button></div><div class="inspect-body" id="inspectBody" role="tabpanel"></div><div class="inspect-foot"><label><input type="checkbox" id="done">我已复刻此节点</label><button id="prev">上一节点</button><button id="next">下一节点</button></div></aside>
</div><div id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="guide-data">__GUIDE_DATA__</script>
<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('guide-data').textContent), byId=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types={'start':'用户输入','end':'输出','llm':'LLM','agent':'经典 Agent','code':'代码执行','knowledge-retrieval':'知识检索','if-else':'条件分支','question-classifier':'问题分类器','assigner':'变量赋值器','variable-aggregator':'变量聚合器','answer':'直接回复','tool':'MCP 工具'};
const icons={'start':'↗','end':'↥','llm':'✦','agent':'A','code':'{ }','knowledge-retrieval':'▤','if-else':'⑂','question-classifier':'≡','assigner':'↧','variable-aggregator':'⋈','answer':'▣','tool':'⚒'};
const nodeName=id=>byId[id]?.data.title||id, shortName=id=>nodeName(id).replace(/^[A-Z0-9]+[a-z]?_/,'');
const pretty=x=>typeof x==='string'?x:JSON.stringify(x,null,2), STORAGE='course-dify-guide-v1';
let chapter='qa',selected='Q03',tab='settings',mode='canvas',prep='scope',done=new Set(),search='',scale=.8,pan={x:30,y:30},layout={},bounds={w:1,h:1},copies=[],visible=[],allEdges=[],drag=null,toastTimer;
try{const state=JSON.parse(localStorage.getItem(STORAGE)||'{}');done=new Set((state.done||[]).filter(id=>byId[id]));}catch{}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({done:[...done]}));}catch{}}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function icon(kind){return `<span class="icon ${esc(kind)}">${icons[kind]||'◇'}</span>`;}
function labelHandle(e){if(e.handle==='fail-branch')return '异常分支';if(e.handle==='false')return 'ELSE';if(e.handle==='source')return '默认出口';const n=byId[e.source]?.data;if(n?.type==='question-classifier')return e.handle+' · '+(n.classes.find(c=>c.id===e.handle)?.name||'');return e.handle==='true'?'IF / yes':e.handle;}
function sourceLabel(a){if(!Array.isArray(a)||!a.length)return '未绑定';if(a[0]==='context')return '本节点 / 上下文 Context 标签';return (a[0]==='sys'?'系统变量':a[0]==='conversation'?'会话变量':nodeName(a[0]))+' / '+a.slice(1).join('.');}
function varRefs(text){return [...String(text||'').matchAll(/\{\{#([^#]+)#\}\}/g)].map(m=>({raw:m[0],path:m[1].split('.')}));}
function field(label,value,hint='',code=false){const id=copies.push(pretty(value))-1;return `<section class="block"><div class="field-label">${esc(label)}<button data-copy="${id}" aria-label="复制${esc(label)}">复制</button></div><div class="valuebox ${code?'codebox':''}"><pre>${esc(pretty(value))}</pre></div>${hint?`<p class="hint">${esc(hint)}</p>`:''}</section>`;}
function refButton(path){const id=path[0];return byId[id]?`<button data-select="${esc(id)}">${esc(sourceLabel(path))}</button>`:`<span class="chip">${esc(sourceLabel(path))}</span>`;}
function bindings(text){const refs=varRefs(text);if(!refs.length)return '';return `<p class="hint">复制文本后，在 Dify 输入框用“/”或变量选择器，把下面的占位表达式换为你自己节点的变量标签：</p>`+refs.map(r=>`<div class="binding"><code>${esc(r.raw)}</code>→ ${refButton(r.path)}</div>`).join('');}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function createSteps(n){const k=n.data.type;const location=k==='agent'?'选择“Agent”中的经典 Agent，再选 FunctionCalling 策略':`选择“${types[k]||k}”`;return `<h3>在 Dify 中怎么做</h3><ol class="step-list"><li>画布左侧“＋”添加节点，${esc(location)}。</li><li>把节点名称改为 <b>${esc(n.data.title)}</b>，便于后续选择变量。</li><li>逐项填写下面的设置；代码、提示词和 Schema 可复制。变量必须绑定到你自己画布上的对应输出。</li><li>在“连线”页按出口名称连接。连线决定执行顺序，变量绑定决定数据来自哪里。</li></ol>`;}
function modelFields(m){return field('模型',m.name||m.model||'kimi-k3','供应商选择你已配置的 OpenAI-API-compatible。')+field('模型参数',m.completion_params||{},'Kimi-k3 不传 temperature。max_tokens 是输出上限，需结合 finish_reason 调整；本手册不会调用模型。');}
function common(d){let h='';if(d.retry_config)h+=field('失败重试',d.retry_config,'retry_enabled=false：关闭自动重试。');if(d.error_strategy)h+=field('异常处理',d.error_strategy,'fail-branch：在界面选异常分支，再从异常出口连线，不能直接忽略错误。');return h;}
function settings(n){const d=n.data,k=d.type;let h=`<p>${esc(D.notes[n.id][0])}</p>`+createSteps(n);
if(k==='llm'){h+=modelFields(d.model);h+=field('Memory / 视觉',{Memory:'关闭',Vision:!!d.vision?.enabled});h+=field('上下文 Context',d.context?.enabled?sourceLabel(d.context.variable_selector):'关闭 / 不绑定',d.context?.enabled?'在 Context 下拉选择此 result；SYSTEM 中用上下文标签插入。正文只注入一次。':'这个节点需要的证据通过 USER 变量显式传入。');for(const p of d.prompt_template||[]){h+=field(p.role.toUpperCase()+' 提示词',p.text,'按角色添加消息，整段复制；变量还需在 Dify 替换。',true)+bindings(p.text);}h+=field('结构化输出',!!d.structured_output_enabled);if(d.structured_output_enabled)h+=field('JSON Schema',d.structured_output.schema,'在“结构化输出→JSON Schema”粘贴。对象由 structured_output 输出；模型非原生支持时更需检验格式。',true);}

function collectBindings(d){const list=[];for(const v of d.variables||[]){if(Array.isArray(v))list.push({name:'聚合输入',path:v});else if(v.value_selector)list.push({name:v.variable,path:v.value_selector});}if(d.query_variable_selector)list.push({name:'查询文本',path:d.query_variable_selector});if(d.context?.enabled)list.push({name:'Context',path:d.context.variable_selector});for(const i of d.items||[])list.push({name:'写入值',path:i.value});for(const c of d.cases||[])for(const v of c.conditions)list.push({name:'判断条件',path:v.variable_selector});for(const v of Array.isArray(d.outputs)?d.outputs:[])if(v.value_selector)list.push({name:'输出 '+v.variable,path:v.value_selector});for(const r of varRefs(JSON.stringify(d)))list.push({name:r.raw,path:r.path});return list.filter((v,i,a)=>a.findIndex(x=>x.name===v.name&&x.path.join('.')===v.path.join('.'))===i);}

function drawLayout(){const idset=new Set(visible.map(n=>n.id));allEdges=D.edges.filter(e=>idset.has(e.source)&&idset.has(e.target));let indeg=Object.fromEntries(visible.map(n=>[n.id,0])),rank=Object.fromEntries(visible.map(n=>[n.id,0]));allEdges.forEach(e=>indeg[e.target]++);let queue=visible.filter(n=>!indeg[n.id]).map(n=>n.id),seen=0;while(queue.length){const id=queue.shift();seen++;for(const e of allEdges.filter(e=>e.source===id)){rank[e.target]=Math.max(rank[e.target],rank[id]+1);if(--indeg[e.target]===0)queue.push(e.target);}}if(seen!==visible.length)throw Error('教学图存在环，请检查连线');let layers={};visible.forEach(n=>(layers[rank[n.id]]??=[]).push(n));let maxRows=Math.max(...Object.values(layers).map(a=>a.length));layout={};for(const [r,ns]of Object.entries(layers)){ns.sort((a,b)=>a.originalY-b.originalY);ns.forEach((n,j)=>layout[n.id]={x:50+Number(r)*310,y:50+j*170+(maxRows-ns.length)*85});}bounds={w:Math.max(...Object.values(layout).map(p=>p.x))+290,h:Math.max(...Object.values(layout).map(p=>p.y))+175};$('world').style.width=bounds.w+'px';$('world').style.height=bounds.h+'px';$('edges').setAttribute('width',bounds.w);$('edges').setAttribute('height',bounds.h);}
function drawGraph(){const visibleEdges=allEdges.filter(e=>$('failures').checked||e.handle!=='fail-branch');$('edges').innerHTML=`<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>`+visibleEdges.map(e=>{const a=layout[e.source],b=layout[e.target],handles=[...new Set(allEdges.filter(x=>x.source===e.source).map(x=>x.handle))],idx=handles.indexOf(e.handle),y=a.y+62+(idx-(handles.length-1)/2)*17,x=a.x+240,tx=b.x,ty=b.y+62,c=Math.max(35,(tx-x)*.5),related=e.source===selected||e.target===selected;return `<g><path class="edge ${e.handle==='fail-branch'?'failure':''} ${related?'related':'dim'}" d="M ${x} ${y} C ${x+c} ${y},${tx-c} ${ty},${tx} ${ty}" marker-end="url(#arr)"/><text class="edge-label" x="${x+9}" y="${y-7}">${esc(e.handle==='source'?'':e.handle==='fail-branch'?'异常':e.handle==='false'?'ELSE':e.handle)}</text></g>`;}).join('');$('nodes').innerHTML=visible.map(n=>{const p=layout[n.id];return `<button class="canvas-node ${n.id===selected?'selected':''}" style="left:${p.x}px;top:${p.y}px" data-select="${esc(n.id)}" aria-label="查看 ${esc(n.data.title)} 的配置" aria-pressed="${n.id===selected}">${done.has(n.id)?'<span class="node-check">✓</span>':''}<span class="node-top">${icon(n.data.type)}<span class="node-name">${esc(n.data.title)}</span></span><div class="node-summary">${esc(summary(n))}</div><div class="node-purpose">${esc(D.notes[n.id][0])}</div></button>`;}).join('');applyTransform();}

function wireCanvas(){$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;$('actual').onclick=()=>{scale=1;center(selected);};$('locate').onclick=()=>center(selected);$('failures').onchange=drawGraph;const v=$('viewport');v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),{x:e.clientX-r.left,y:e.clientY-r.top});},{passive:false});v.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};v.setPointerCapture(e.pointerId);});v.addEventListener('pointermove',e=>{if(!drag)return;pan={x:drag.px+e.clientX-drag.x,y:drag.py+e.clientY-drag.y};applyTransform();});const end=()=>drag=null;v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);}
const canvasMarkup=$('stage').innerHTML;
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select)selectNode(b.dataset.select);else if(b.dataset.chapter){chapter=b.dataset.chapter;search='';$('search').value='';renderCanvas();}else if(b.dataset.prep){prep=b.dataset.prep;renderPrep();}else if(b.dataset.tab){tab=b.dataset.tab;inspector();}else if(b.dataset.copy!==undefined){const text=copies[Number(b.dataset.copy)];try{await navigator.clipboard.writeText(text);toast('已复制；Dify 变量需用选择器重新绑定');}catch{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();toast(ok?'已复制':'复制受浏览器限制，请选中文本后手动复制');}}});
$('search').addEventListener('input',e=>{search=e.target.value;renderList();});$('canvasMode').onclick=()=>renderCanvas();$('prepMode').onclick=()=>renderPrep();$('startGuide').onclick=()=>{prep='scope';renderPrep();};$('print').onclick=()=>window.print();$('done').onchange=e=>{e.target.checked?done.add(selected):done.delete(selected);save();renderList();drawGraph();};$('prev').onclick=()=>{const i=visible.findIndex(n=>n.id===selected);if(i>0)selectNode(visible[i-1].id);};$('next').onclick=()=>{const i=visible.findIndex(n=>n.id===selected);if(i<visible.length-1)selectNode(visible[i+1].id);};$('version').textContent=D.version;window.addEventListener('resize',()=>{if(mode==='canvas')applyTransform();});renderCanvas();
})();

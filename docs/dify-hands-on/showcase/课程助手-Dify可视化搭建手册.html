.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--canvas)}.stage-head{padding:14px 17px 12px;background:var(--bg);border-bottom:1px solid var(--line)}.stage-head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stage-head h2{font-size:15px;margin:0}.stage-head p{font-size:12px;color:var(--muted);margin:3px 0 0}.decision{background:var(--bg);padding:9px 17px;border-bottom:1px solid var(--line);font-size:12px;line-height:1.7}.decision b{font-weight:600;color:var(--blue)}.viewport{position:relative;overflow:hidden;flex:1;touch-action:none;background-image:radial-gradient(oklch(.82 .014 260) .8px,transparent .8px);background-size:16px 16px;cursor:grab}.viewport:active{cursor:grabbing}.world{position:absolute;transform-origin:0 0;left:0;top:0}.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:oklch(.72 .045 262);stroke-width:1.7}.edge.failure{stroke:oklch(.61 .08 25);stroke-dasharray:5 4}.edge.related{stroke:var(--blue);stroke-width:2.5}.edge.dim{opacity:.3}.edge-label{font:11px "Segoe UI",sans-serif;fill:var(--muted);paint-order:stroke;stroke:var(--canvas);stroke-width:4px;stroke-linejoin:round}.canvas-node{position:absolute;width:240px;height:124px;padding:13px 13px 10px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);cursor:pointer}.canvas-node:hover{background:var(--bg);border-color:oklch(.7 .11 262)}.canvas-node.selected{border:2px solid var(--blue);padding:12px 12px 9px}.canvas-node::before,.canvas-node::after{content:"";position:absolute;top:58px;width:7px;height:7px;border:1px solid var(--blue);border-radius:50%;background:var(--bg)}.canvas-node::before{left:-5px}.canvas-node::after{right:-5px}.node-top{display:flex;align-items:center;gap:8px}.icon{height:24px;width:24px;border-radius:6px;display:inline-flex;justify-content:center;align-items:center;background:var(--purple);color:white;font-size:12px;font-weight:700;flex:none}.icon.code{background:var(--blue)}.icon.knowledge-retrieval{background:var(--green)}.icon.answer,.icon.end{background:var(--orange)}.icon.start{background:var(--blue)}.icon.if-else,.icon.question-classifier,.icon.assigner,.icon.variable-aggregator{background:oklch(.47 .10 170)}.icon.agent{background:var(--purple)}.icon.tool{background:oklch(.47 .12 220)}.node-name{font-weight:600;line-height:1.4;font-size:13px;overflow-wrap:anywhere}.node-summary{font-size:11px;color:var(--muted);background:var(--panel);padding:4px 6px;margin-top:10px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-purpose{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node-check{position:absolute;top:7px;right:7px;color:var(--green);font-size:11px}.canvas-foot{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:9px 12px;background:var(--bg);border-top:1px solid var(--line);font-size:12px}.canvas-foot button{padding:4px 8px}.canvas-foot label{margin-left:auto;display:flex;gap:4px;align-items:center}.canvas-help{padding:5px 12px 8px;background:var(--bg);font-size:11px;color:var(--muted)}

:top;padding:8px 5px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}th{font-weight:600;color:var(--muted)}td code{font-size:11px}.connect-row{display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line);padding:9px 0;font-size:12px}.connect-row button{text-align:left;overflow-wrap:anywhere;flex:1}.sources a{display:block;padding:7px 0;font-size:12px}.reading .stage{grid-column:2/4;background:var(--bg);overflow-y:auto;display:block}.reading .inspector{display:none}.reading .stage-head{position:sticky;top:0;background:var(--bg);z-index:1}.reading-content{padding:20px 28px 60px;max-width:1020px;margin:auto}.reading-content h1{font-size:23px;margin:7px 0 13px}.reading-content h2{font-size:18px;margin-top:30px}.reading-content p{max-width:76ch}.reading-content .step-list{max-width:80ch}.reading-content .step-list li{margin:8px 0}.reading-content table{max-width:900px}.progress-text{color:var(--muted);font-size:12px}#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:7px;z-index:10;box-shadow:var(--shadow)}[hidden]{display:none!important}.empty{padding:15px;color:var(--muted);font-size:12px}.mobile-toggle{display:none}

<body>
<header class="topbar"><div class="brand">D<i>ify</i><small>复刻学习手册</small></div><div class="title"><h1>课程智能学习助手</h1><div class="topmeta">先看连线，再照着填写每个节点</div></div><div class="topactions"><span class="offline">● 离线阅读 · 无模型调用</span><button class="print" id="print">打印当前内容</button><button class="primary" id="startGuide">从准备工作开始</button></div></header>
<div class="shell" id="shell">
<aside class="sidebar"><div class="app-name">🤖 完整课程学习闭环<small id="version"></small></div><div class="modes"><button id="canvasMode" class="active">画布与节点</button><button id="prepMode">搭建准备</button></div><nav class="chapter-list" id="chapters" aria-label="教程章节"></nav><div class="node-search"><input id="search" type="search" aria-label="搜索全部节点" placeholder="搜索节点、编号…"></div><div class="node-list" id="nodeList" aria-label="节点列表"></div><div class="sidebar-foot" id="progress">复刻进度仅保存在本机浏览器。</div></aside>
<main class="stage" id="stage"><div class="stage-head"><div class="row"><h2 id="chapterTitle"></h2><span class="progress-text" id="count"></span></div><p id="chapterSubtitle"></p></div><div class="decision" id="decision"></div><div class="viewport" id="viewport" aria-label="可拖动缩放的节点连接画布"><div class="world" id="world"><svg class="edges" id="edges" aria-label="节点连线"></svg><div id="nodes"></div></div></div><div class="canvas-foot"><button id="zoomOut" aria-label="缩小画布">−</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="放大画布">＋</button><button id="fit">适应画布</button><button id="actual">1:1</button><button id="locate">定位选中</button><label><input type="checkbox" id="failures" checked>显示异常连线</label></div><div class="canvas-help">拖空白处平移 · 滚轮缩放 · 点击节点查看配置 · 虚线为异常分支</div></main>
<aside class="inspector" id="inspector" aria-label="选中节点配置"><div class="inspect-title" id="inspectTitle"></div><div class="status-line">教学配置 · 依据本地方案与实际页面整理，待你逐支复测</div><div class="tabs" role="tablist" aria-label="节点详情"><button role="tab" data-tab="settings" aria-selected="true">设置</button><button role="tab" data-tab="io" aria-selected="false">输入 / 输出</button><button role="tab" data-tab="connections" aria-selected="false">连线</button><button role="tab" data-tab="pm" aria-selected="false">产品思考</button><button role="tab" data-tab="raw" aria-selected="false">完整参数</button></div><div class="inspect-body" id="inspectBody" role="tabpanel"></div><div class="inspect-foot"><label><input type="checkbox" id="done">我已复刻此节点</label><button id="prev">上一节点</button><button id="next">下一节点</button></div></aside>
</div><div id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="guide-data">{"nodes":[{"id":"START","data":{"type":"start","title":"用户输入","desc":"示范版 v1；详见节点参数手册","variables":[]},"originalY":450},{"id":"E00","data":{"type":"answer","title":"E00_运行失败时保留学习状态","desc":"示范版 v1；详见节点参数手册","answer":"本轮模型或工具运行失败，尚未保存新的成绩。请稍后重试；已有题目与学习记录保留。","variables":[]},"originalY":100},{"id":"E01","data":{"type":"answer","title":"E01_成绩已保存但辅导失败","desc":"示范版 v1；详见节点参数手册","answer":"成绩与参考答案已展示并保存，本轮辅导暂时失败。可输入 /记录 查看成绩，请勿重复交卷。","variables":[]},"originalY":1600},{"id":"R01","data":{"type":"code","title":"R01_状态与入口","desc":"示范版 v1；详见节点参数手册","code_language":"python3","variables":[{"variable":"query","value_selector":["sys","query"],"value_type":"string"},{"variable":"saved_state","value_selector":["conversation","learning_state"],"value_type":"string"}],"code":"\"\"\"Paste into Dify Python code node R01. No network, files, or third-party imports.\"\"\"\nimport json\nimport re\nfrom datetime import datetime, timedelta, timezone\n\n\ndef main(query: str, saved_state: str, scope: str = \"all\") -> dict:\n    today = datetime.now(timezone(timedelta(hours=8))).date().isoformat()\n    try:\n        state = json.loads(saved_state or \"{}\")\n        if not isinstance(state, dict):\n            raise ValueError(\"state\")\n    except (ValueError, TypeError):\n        return dict(action=\"notice\", topic=\"\", answers=\"{}\", pending=\"{}\", context=\"{}\",\n                    state=saved_state or \"{}\", notice=\"学习状态格式异常，请新建聊天；本轮没有调用模型。\", review_topic=\"\")\n    for key, default in {\"preferences\": \"\", \"pending\": {}, \"reviews\": {}, \"results\": [],\n                         \"history\": [], \"web_attempts\": 0, \"scope\": \"all\"}.items():\n        state.setdefault(key, default)\n    scope = scope or \"all\"\n    if state[\"scope\"] != scope:\n        state.update(scope=scope, pending={}, history=[])\n    q = query.strip()\n    action, topic, answers, notice, review_topic = \"qa\", q, {}, \"\", \"\"\n    if q.startswith(\"/偏好 \"):\n        state[\"preferences\"] = q[len(\"/偏好 \"):].strip()[:200]\n        state[\"history\"] = []\n        action, notice = \"notice\", \"已保存你明确提供的偏好；旧近期对话不再进入模型上下文。\"\n    elif q == \"/删除偏好\":\n        state[\"preferences\"], state[\"history\"] = \"\", []\n        action, notice = \"notice\", \"已清空本会话偏好与近期上下文。聊天气泡和平台日志不由此删除。\"\n    elif q == \"/退出练习\":\n        state[\"pending\"] = {}\n        action, notice = \"notice\", \"已退出待作答练习，没有更新掌握状态。\"\n    elif q == \"/记录\":\n        action = \"notice\"\n        notice = \"最近有效成绩（仅本会话）\\n\" + json.dumps(state[\"results\"][-12:], ensure_ascii=False)\n    elif q == \"/复习\":\n        due = [(k, v) for k, v in state[\"reviews\"].items() if v.get(\"due\", \"9999\") <= today]\n        due.sort(key=lambda item: item[1][\"due\"])\n        if state[\"pending\"]:\n            action, notice = \"notice\", \"还有待作答练习，请先 /作答 或 /退出练习。\"\n        elif due:\n            review_topic, record = due[0]\n            action, topic = \"practice\", review_topic\n        else:\n            action, notice = \"notice\", \"今天没有到期复习；可输入 /练习 知识点 主动练习。\"\n    elif q.startswith(\"/练习\"):\n        topic = q[len(\"/练习\"):].strip()\n        if state[\"pending\"]:\n            action, notice = \"notice\", \"已有待作答题，请先交卷或输入 /退出练习。\"\n        elif not topic:\n            action, notice = \"notice\", \"请指定一个知识点，例如 /练习 RAG 的职责与边界。\"\n        else:\n            action = \"practice\"\n    elif q.startswith(\"/作答\"):\n        action = \"submit\"\n        if not state[\"pending\"]:\n            action, notice = \"notice\", \"没有待作答题；重复交卷不会再次记成绩。\"\n        else:\n            body = q[len(\"/作答\"):].strip()\n            parts = re.findall(r\"(?ms)^([123])[.、．]\\s*(.*?)(?=^[123][.、．]|\\Z)\", body)\n            if len(parts) != 3 or {key for key, _ in parts} != {\"1\", \"2\", \"3\"}:\n                action, notice = \"notice\", \"请按三行题号交卷：1.答案、2.答案、3.答案；每题都要填写。\"\n            elif any(not value.strip() or len(value) > 2000 for _, value in parts):\n d,\n                   \"review_due\": reviews.get(topic, {}).get(\"due\", \"\")}\n        state[\"results\"] = (state.get(\"results\", []) + [summary])[-12:]\n        state[\"pending\"] = {}\n        view = {\"summary\": summary, \"items\": items, \"questions\": pending[\"questions\"]}\n        serialized = json.dumps(state, ensure_ascii=False)\n        assert len(serialized) < 70000, \"会话状态过大，需要外部学习档案服务\"\n        lines = [f\"本轮总分：{summary['total']}/18；主题：{topic}\"]\n        for item in sorted(items, key=lambda x: x[\"question_id\"]):\n            question = questions[item[\"question_id\"]]\n            lines.append(f\"\\n第{item['question_id']}题：{item['total']}/6\"\n                         f\"（正确性{item['correctness']}、完整性{item['completeness']}、应用理由{item['reasoning']}，各满分2）\")\n            lines.append(\"评估反馈：\" + item[\"feedback\"])\n            lines.append(\"参考答案：\" + question[\"reference_answer\"])\n            lines.append(\"课程依据：\" + \" \".join(\"[\" + source + \"]\" for source in item[\"source_ids\"]))\n        if summary[\"review_due\"]:\n            lines.append(\"\\n下次复习：\" + summary[\"review_due\"] + \"；采用首版1/3/7天规则。\")\n        return {\"ok\": \"yes\", \"state\": serialized, \"feedback\": json.dumps(view, ensure_ascii=False),\n                \"display\": \"\\n\".join(lines), \"error\": \"\"}\n    except (AssertionError, KeyError, ValueError, TypeError) as exc:\n        return {\"ok\": \"no\", \"state\": original, \"feedback\": \"\", \"display\": \"\", \"error\": str(exc)[:500]}\n","outputs":{"ok":{"type":"string","children":null},"state":{"type":"string","children":null},"feedback":{"type":"string","children":null},"display":{"type":"string","children":null},"error":{"type":"string","children":null}},"retry_config":{"retry_enabled":false,"max_retries":0,"retry_interval":1000}},"originalY":1200},{"id":"G03b","data":{"type":"if-else","title":"G03b_有效评分才写入","desc":"示范版 v1；详见节点参数手册","cases":[{"case_id":"true","logical_operator":"and","conditions":[{"varTy ,"focus":"G03","decision":"模型判断作答质量；代码校验分数、计算总分、排期并更新状态。角色有不同职责，不需要为每个 LLM 方块再创建一个 Agent。"},{"id":"web","title":"可选联网","subtitle":"一个 Tavily MCP，明确授权后搜索","ids":["START","R01","R02","R03","N00","W01","W01b","W01c","W02","W03","W00"],"focus":"W01","decision":"用明确的 /联网 入口控制费用与隐私；一轮只进行基础搜索。当前每会话 10 次上限不能替代本地版的每月全局 300 次预算。"},{"id":"all","title":"完整画布","subtitle":"64 个节点与全部 79 条连线","ids":[],"focus":"R03","decision":"全图用于核对完整性；学习时按分支看，先跑通课程答疑，再逐步增加练习、评分、复习和工具。错误分支用虚线表示。"},{"id":"tool","title":"课程检索工具","subtitle":"四节点 Workflow，供两个 Agent 使用","ids":["TS","TQ","TK","TE"],"focus":"TQ","decision":"把检索能力包装为只读 Workflow 工具，供模型原生 Tool Calling 使用。Tavily 才是这里的外部 MCP，两者不要混称。"}],"notes":{"START":["接收这一轮消息","Chatflow 用系统 query 接收聊天输入；不再重复添加一个必填 query 表单。","输入 /记录，确认走状态提示分支。"],"R01":["把显式操作与学习状态分开","命令式入口优先于模型猜测。代码只接受有效的三题作答；学生消息本身没有写成绩的权限。","没有待作答题时输入 /作答，应该提示尚无题目。"],"R02":["保存经过入口检查的状态","记录搜索尝试次数等状态；这是当前聊天的覆盖写入，不是跨用户数据库。","先 /偏好 用产品例子解释，再 /记录，检查偏好。"],"R03":["按任务进入四条业务路径","qa、practice、submit、web 互斥。偏好、记录、无效命令走 ELSE，避免浪费 LLM 调用。","分别看四个 CASE 的变量、比较符和出口，不能只连 source。"],"N00":["直接返回确定性操作反馈","偏好保存、删除、记录查询等已有结果无需再让模型润色，减少费用和误述。","输入 /删除偏好，检查提示及后续 context。"],"I01":["识别解释、比较、练习和歧义","分类只负责普通提问的教学方式，正式交卷由 R01 识别。分类器本身也会调用一次 LLM。","用“它有什么区别”测试指代不明；用两个明确术语测试 compare。"],"I03":["把自然语言练习请求导向正式入口","明确告诉用户 /练习 和 /作答 的格式，降低误将聊天消息记成成绩的风险。","输入“考考我”，应提示入口而不是直接保存成绩。"],"I04":["先补充对象再检索","不清楚指代时提一个具体问题，避免检索和编造答案。","检查回复是否让用户知道需要补充什么。"],"I02":["把追问改成独立检索词","只带必要近期对话与偏好，不把所有历史发送给模型。输出用于检索，不能当课程事实。","先问 RAG，再问“它适合什么场景”，看检索词是否补回 RAG。"],"A02":["学习教练自主核查课程术语","经典 Function Calling Agent 只拿到只读 search_course；提示要求先查证，实际是否调用必须看工具轨迹。","检查真实 tool call 的名称、query 和工具结果；只经过绿色节点不算。"],"A02b":["限制 Agent 产生的检索词","过长或多行输出退回原问题，防止把长篇回答当查询词。","手工以多行 proposed 调试代码，应返回 original 的前 200 字。"],"IQ":["合并互斥分支的检索词","解释和比较一次只走一条路；用变量聚合器取执行过的输出，不要求两个变量都存在。","分别走 explain 和 compare，确认 Q01 收到非空 query。"],"Q01":["从完整课程中召回证据","库级与节点级都使用高质量混合权重；0.7/0.3 是初始取舍，需要题集验证，不能称作原项目 RRF。","看 result 中的原文、课程来源编号及数量；无模型 rerank。"],"K02":["把来源目录与原文分开","去重并提取来源 ID，给教练一个允许引用的目录；正文通过检索上下文注入。","输入相同来源两次，应去重；不要把 suitable_questions 当正文。"],"Q03":["依据课程解释与引用","SYSTEM 规定证据边界，USER 提供当前问题与必要记忆，Context 绑定 Q01/result。只写提示词而不绑定上下文会丢失来源关系。","检查关键事实的 [来源ID] 与原文支持；检查 finish_reason 是否为 length。"],"Q05":["拦截不存在的引用并保存近期对话","代码能检查已写出的编号是否合法；不能自动证明每项事实都有证据。当前代码不强制回答必须写编号，仍需人工验收。","伪造 [NOT_A_SOURCE] 应拦截且不改变 state；无编号回答也要单独人工检查。"],"Q06":["仅保存本轮近期答疑","保留短对话窗口便于追问。问过问题不等于掌握，不能增加成绩或推进复习等级。","查看 state，history 增加但 records/reviews 不应因答疑增加。"],"Q04":["展示经过引用检查的回答","直接回复绑定 Q05/display，避免绕过校验直接显示 Q03/text。","点开 Dify 引用卡核对正文；单文件卡名相同仍需看内文编号。"],"P00":["为练习检索课程证据","出题范围来自当前知识点；评分也只能依赖这份允许的课程证据。","输入 /练习 RAG，查看是否召回课程片段。"],"P00b":["建立出题用证据包","与答疑共用来源解析规则，确保问题、参考答案和评分条目可追溯。","核对 catalog、source_ids、has_evidence 与原文一致。"],"P00c":["证据不足不生成练习","避免为了凑三题调用通识知识，也避免花费模型 Token 生成无法评分的题。","模拟空 result，应走 P00n。"],"P00n":["说明课程证据不足","没有创建题包，也没有改变成绩；让用户换课程内知识点。","检查 pending 没有被写入一个虚构练习。"],"R09":["区分新练习与到期复习","review_topic 由历史有效评分与日期规则产生，用户仅说“懂了”不会触发升级。","有到期主题走 R10；普通练习走 P01。"],"R10":["围绕历史误解重新解释","只提供相关误解和课程证据，不把学生过往错误写成正确知识。","检查提示词里误解与课程正文有明确角色区分。"],"R11":["先解释，再出变式题","让复习包括纠正与再次检验，避免只是把同一道题重复一遍。","回复后应继续到 P01，不在此提前结束分支。"],"P01":["教练生成恰好三题与评分标准","结构化题包包含参考答案但提交前只显示题干。简答与场景题服务理解检验。","检查 JSON Schema、三题数量、每题证据和评分标准。"],"P02":["把题包对象变为 JSON 字符串","下游代码节点接收 string，显式序列化避免把 object 绑定成 string。","输入绑定 structured_output，不是 text。"],"P03":["独立评估员审核可答性","它只看题目、标准、课程证据，不看教练对学生的主观判断；审核分工收益仍需消融。","构造证据不支持的题目，期望审核拒绝。"],"P04":["序列化审题结果","对象输出转字符串后才交给确定性校验。","绑定 P03/structured_output，输出 json 为 String。"],"P05":["校验三题结构与引用白名单","模型说通过仍需代码检查 ID、题数、来源、审核结果。合法才生成 pending，display 不含参考答案。","缺题、错误来源、审核不通过都应 ok=no。"],"P05b":["决定保存还是修订","只看代码输出 ok，不解析模型自然语言里的“通过”。","yes→P05s；ELSE→P06。"],"P05s":["保存待作答题","保存完整题包用于稍后评分；题干展示仍只用 display。","pending 有参考标准，但前端回复不能泄露标准。"],"P05a":["仅展示三道题干","先作答后看参考答案，才能取得理解证据。","确认回复里无参考答案、评分示范或隐藏字段。"],"P06":["只修订一次不合格题包","把审核意见反馈给教练；一次上限控制等待与费用，不让 Agent 无限重试。","失败路径只进入 P06 一次，无回到 P01 的边。"],"P07":["序列化修订题包","沿用相同 Schema，保持初稿和修订的验证口径。","绑定 P06/structured_output。"],"P08":["评估员复审修订题","审题职责不由教练自我确认，审核条件与初审一致。","再次不合格时应停止，不能第三次修订。"],"P09":["序列化复审结果","统一交给同一校验代码，避免两套松紧不同的规则。","绑定 P08/structured_output。"],"P10":["修订后再做结构与来源校验","重复使用初审校验代码是共用约束，不是增加一个新 Agent。","伪造来源仍应失败。"],"P10b":["复审决定保存或结束","通过才保存，不通过给出明确失败信息。","yes→P10s；ELSE→P10n。"],"P10s":["保存修订后题包","覆盖为最终通过的题包，评分只依据这个版本。","检查 pending 内容是修订版。"],"P10a":["展示修订后的题干","仍然不展示参考答案。","检查 display 与保存题包的三个题号相同。"],"P10n":["修订仍失败则结束","保留可理解的失败状态，避免假装完成出题。","确认没有保存本轮不合格题包。"],"G01A":["评估员 Agent 独立核查并评分","只读检索课程概念词，学生答案不发给检索工具。它输出分项 JSON，不直接写数据库。","查看原生 tool call；检查最终 JSON 和 practice_id。"],"G02A":["严格解析 Agent 的最终 JSON","只接受对象与必需顶层字段；解析成功不等于业务评分合法，还要经过 G03。","给普通自然语言或截断 JSON，ok 应为 no。"],"G02b":["仅在 Agent 格式失败时降级","成功走 G02M，格式失败用 G01 独立评分兜底。一次降级仍可能增加延迟与 Token。","true/yes 出口接 G02M；ELSE 接 G01。"],"G01":["确定格式的独立评分兜底","使用相同课程证据与标准；此节点不是第三个角色，它仍是评估员。","不能接收教练对学生的先验评价。"],"G02":["序列化兜底评分对象","只有兜底路径执行时此输出存在。","绑定 G01/structured_output。"],"G02M":["汇合互斥评分路径","取 Agent 成功或结构化兜底之一，避免合并两次评分。","确认 G03 的 grade_json 取本节点 output。"],"G03":["校验分项分数并安排复习","概念、完整性、应用各 0–2；总分和 1/3/7 天日期由代码计算。有效成绩才进入学习证据。","测错 practice_id、越界分、伪造来源、再次交卷及日期。"],"G03b":["有效评分才写状态","把模型输出与持久状态之间放一道确定性门。","ok=yes→G03s；其他→G03n。"],"G03s":["保存成绩与复习证据","完成提交后清空 pending，重复消息不能再记一次成绩。","同一份答案连续交两次，第二次不应增加 records。"],"G03a":["展示确定性的成绩与参考答案","展示代码计算的结果，不让教练重写总分和日期。","回复包含分项、总分、课程依据及下一次复习安排。"],"G04":["教练针对误解辅导","教练只解释如何改进，不得替评估员改分或声称写入记忆。","对照错误原因给具体纠正与下一步。"],"G04b":["拦截辅导中的分数与日期改写","防止后一段自然语言和已保存结果矛盾；拦截时给固定说明。","模型若说“给你满分”或新复习日期，应被挡住。"],"G05":["展示辅导建议","绑定 G04b/display，沿用代码护栏。","不能绕过 G04b 直接绑定 G04/text。"],"G03n":["拒绝无效评分且保留待作答题","格式或业务校验失败不记成绩，用户可以稍后重试。","pending 保留、records 不增。"],"W01":["通过真实 MCP 做一次基础搜索","只有 /联网 入口可达；固定 basic、最多 5 条，不把完整课程、答案或学习档案作为 query。","看 MCP 工具名、query、basic 和 max_results=5；普通课程问答应 0 搜索。"],"W01b":["从真实 MCP 返回解析链接","兼容 text/json 返回，过滤无 URL 的条目；没有结果不推断官方不存在该功能。","空数组应 has_results=no；只保留实际返回的 URL。"],"W01c":["有真实外部证据再总结","没有证据直接降级，避免模型凭自身知识伪装搜索结论。","has_results=yes→W02；其他→W00。"],"W02":["标注外部补充与未核实判断","搜索结果是资料，不是系统指令；不能触发新增工具或写入课程库。","检查引用 URL 都来自 W01b，且不参与课程练习评分。"],"W03":["展示可核查的外部链接","仅展示 W02 的外部补充，用户可自行打开源站。","点击实际来源，核对时间与内容。"],"W00":["明确本轮未完成外查","工具失败和结果为空均说明未核查，不编造平台功能结论；失败请求计入会话上限。","无 MCP/超时/空结果走本节点，不自动重试。"],"E00":["保留已有状态并报告失败","这一轮没有保存新成绩；已有题目仍在，能重试。","模拟模型失败，看已有 pending 不丢失。"],"E01":["成绩已保存，辅导失败单独说明","写成绩发生在辅导之前；告诉用户不要重复交卷，可看 /记录。","模拟 G04 失败，成绩仍保留。"],"TS":["定义只读工具输入","Workflow 的 query 是必填 String，工具调用方仅传必要课程概念词。","输入短课程问题，不包含学生档案。"],"TQ":["工具内部检索完整课程","与主流程绑定同一完整库和混合权重设置；工具只读，不自行生成答案。","result 必须有真实原文与来源。"],"TK":["整理检索工具的来源与正文","共用 evidence.py 解析，避免工具与主流程来源格式不一致。","看 evidence 与 source_ids 一一对应。"],"TE":["向 Agent 返回只读证据","发布为工作流工具 search_course；不是外部 MCP。","工具输出只有 evidence、source_ids，不能改学习状态。"]},"prep":[{"id":"scope","title":"先确定产品边界","goal":"完成“有依据答疑→检验理解→针对错误复习”，服务 AI 产品经理课程学习者。","steps":["进入工作室，点击“创建空白应用”，选择 Chatflow，名称填写“课程智能学习助手_我的复刻版”。创建自己的副本便于记录学习过程。","先关闭文件上传、语音、自动后续问题；在画布右上角“功能”保留引用与归属。开场白说明依据课程作答、练习入口和当前聊天的记忆范围。","按节点标题添加节点。点击右侧小圆点拖到下一节点左侧；分支节点必须从对应 CASE 或 ELSE 端口拖线，模型失败从异常分支端口连线。"],"fields":[["应用类型","Chatflow"],["普通提问","直接输入课程问题"],["练习入口","/练习 RAG 的职责与边界"],["正式交卷","/作答\n1. 第一题答案\n2. 第二题答案\n3. 第三题答案"],["复习与记录","/复习；/记录"],["偏好与清除","/偏好 用产品例子解释；/删除偏好；/退出练习"]],"pm":"我的首版不加模拟面试、简历优化和机构后台，因为它们会增加内容与评测负担。能完成一次有证据的学习回合，才证明核心价值。","check":"先用 /记录 验证确定性入口，随后再花额度测试一个课程问题。"},{"id":"models","title":"准备模型，不盲目复制参数","goal":"LLM 使用 API；Embedding 用你指定的模型；rerank 首版省略。","steps":["左侧点击“集成→模型供应商”，找到 OpenAI-API-compatible。使用你已配置的 kimi-k3 聊天模型和 qwen3.7-text-embedding-flash 文本嵌入模型。密钥由你自己在供应商凭据中填写，不放到提示词、代码或本手册。","点开模型确认实际 API 地址和名称对应你的服务。Kimi-k3 支持原生工具调用时，经典 Agent 选择 FunctionCalling；不要仅因模型列表可见就判断工具调用已经成功。","在每个 LLM 节点点“模型”，选 kimi-k3。temperature 留空：本账号此前传 0.7 实际收到 400 参数错误。普通生成输出上限先用 3000，结构化输出与 Agent 用 5000；这是待你复测的预算，不是每次一定使用这么多 Token。"],"fields":[["LLM","kimi-k3 / Chat Completions / 原生 Tool Calling"],["Embedding","qwen3.7-text-embedding-flash"],["temperature","不传；不要填 0 或 0.7 代替留空"],["普通 LLM max_tokens","3000，视真实输出长度调整"],["结构化 LLM / Agent max_tokens","5000，检查 finish_reason"],["自动重试","关闭；题包修订由明确分支控制"]],"pm":"我把配置兼容、业务格式和事实质量分开验收。此前模型输出上限 900 导致回答以 length 结束，虽然流程显示成功，回答仍不完整。先看失败原因，再增加预算，避免把“绿色节点”当质量指标。","check":"一次真实调用后检查 usage 和 finish_reason。若服务不支持原生 Schema，Dify 可使用提示词约束，但仍需要代码验证格式。"},{"id":"knowledge","title":"用完整 14 节课建立知识库","goal":"保留 877 个原始来源单元，父子检索；课程内容留在私有工作空间。","steps":["在“知识库”点击创建，选“导入已有文本→从文件导入”。当前账号单次只能选一个文件时，使用项目 runtime/dify-import/course_full_dify.csv。它是专用单列 content 文件；不要把原始多列 CSV 直接当同样的导入格式。","如需重新生成，按第 2 章脚本从 chunk/all_course_chunks_clean_v1.csv 转换。每条保留来源编号、课程编号、课程名、主题和正文，用 @@CHUNK@@ 分隔；suitable_questions 不进入事实正文。确认共 877 条后上传。","分段方式选父子：父段按段落、分隔符 @@CHUNK@@、最大 1500 字符；子段分隔符 。、最大 320 字符。关闭替换连续空白和删除 URL 的预处理，预览是否保留来源编号。这里是字符，不是本地 BGE tokenizer 的 tokens。","索引方式选“高质量”，Embedding 选 qwen3.7-text-embedding-flash。检索选“混合检索→权重设置”，语义 0.7、关键词 0.3、Top K 6，Score 阈值关闭。不要选择 rerank 模型。","名称可用 Course_Learning_Full_qwen3_7_v1，可见权限选“只有我”。保存处理后，等待文档显示“可用”和 877 个父分段；处理中的库先不进入验收。","知识库→召回测试，先用一个课程内问题看原文与来源。主 Chatflow 的 Q01/P00 和检索 Workflow 的 TQ 都必须选择同一个完整库，并核对节点级召回设置。"],"fields":[["导入文件","course_full_dify.csv，单列 content"],["完整规模","14 节课 / 877 个父分段"],["父段分隔符 / 上限","@@CHUNK@@ / 1500 字符"],["子段分隔符 / 上限","。 / 320 字符"],["索引 / Embedding","高质量 / qwen3.7-text-embedding-flash"],["召回","混合权重：语义 0.7、关键词 0.3；Top K 6；阈值关闭"],["模型 rerank","不启用"]],"pm":"当前专用 CSV 合并成一个文档，课程编号写在片段正文，不是 Dify 文档元数据。自然语言写“仅第 3 课”不能保证单课过滤。严格单课筛选需要按课程拆文档、添加 course_id 元数据并实际配置过滤，或接本地检索服务；本教程主线明确为全库检索。","check":"此前完整库已实际索引为可用并返回 6 个相关片段；这不证明人工题集 Recall/NDCG 达标。父子分段检索后仍要核对返回正文是否含来源编号。"},{"id":"state","title":"配置会话变量、Memory 与 Skills","goal":"只保存明确偏好和真实作答证据，不把读过答案当掌握。","steps":["Chatflow 顶部点击“会话变量→添加”，名称 learning_state，类型 String，默认值 {}，说明填“当前聊天的偏好、待作答题、近期成绩与复习队列”。","所有 LLM 和经典 Agent 的自动聊天 Memory 关闭。通过 R01/context 显式传入偏好、近期对话或历史误解；评估员只接题包和本次答案，不接教练的主观评价。","R02/Q06/P05s/P10s/G03s 使用“变量赋值器”：目标 conversation/learning_state，覆盖，上游 state 字段。注意“变量聚合器”只合并互斥分支输出，不是写入记忆。","概念讲解指令放 Q03，三题练习指令放 P01，薄弱点复习放 R10 与 P01。按分支加载属于版本化应用 Skills 的映射；经典 Chatflow 没有因此变成 New Agent 的原生 Skills 运行时。"],"fields":[["名称","learning_state"],["类型","String"],["初始值","{}"],["写入方式","变量赋值器 → 覆盖"],["偏好删除","/删除偏好：删除偏好并清空近期上下文"],["复习规则","有效作答后按代码安排 1、3、7 天；错题回到短间隔"]],"pm":"会话变量跨当前聊天轮次保留，但新聊天不是同一个学习档案。跨会话查询、修改和删除历史的完整能力需要数据库或本地 API；不能在简历里把这个 Dify 方案写成已实现跨会话长期记忆。","check":"同一聊天测试保存/删除偏好；检查后续模型输入。删除上下文不等于删除 Dify 的平台日志。"},{"id":"toolsetup","title":"发布只读课程检索 Workflow 工具","goal":"让两个角色通过原生 Tool Calling 查询真实课程。","steps":["工作室→创建空白应用→工作流，名称“课程证据检索工具_我的复刻版”。按“课程检索工具”画布搭 TS→TQ→TK→TE 四个节点。","TS 的用户输入添加 query，String，必填。TQ 查询绑定 TS/query，知识库选择完整库。TK 输入绑定 TQ/result，复制手册代码，输出 evidence/source_ids 等字段。","TE 选“输出”节点，添加 evidence→TK/evidence、source_ids→TK/source_ids。这里返回证据，不让工具另调用模型生成答案。","点击“发布→发布更新”，再配置“工作流作为工具”，名称 search_course，工具说明复制 Agent 节点的工具描述；query 让 Agent 自动填写，不要固定成一段用户答案。","在 A02 与 G01A 选择经典 Agent、FunctionCalling、kimi-k3；添加这个已发布的 Workflow 工具，最大迭代 3，Memory 关。访问点中关闭这个只读工具的独立 Web App，避免把私人课程直接对外发布。"],"fields":[["工具名","search_course"],["query","String，必填，由 Agent 填充"],["工具返回","evidence String；source_ids String（JSON 编码数组）"],["权限","只读课程，不联网、不写学习状态"],["最大迭代","3"]],"pm":"固定 RAG 节点负责稳定检索；Agent 工具核查是受限的自主行为。两个 Agent 使用同一个模型也可以有不同权限与上下文，但是否改善效果要做单/双角色对照。","check":"真实运行详情必须看到工具名、参数和结果。模型说“我查过了”不构成调用证据。"},{"id":"mcp","title":"可选配置 Tavily 官方 MCP","goal":"只有用户显式 /联网 时搜索公开资料。","steps":["左侧“集成→工具→MCP”添加服务器，名称可填“Tavily 课程外查证”，服务器标识 tavily_learning。端点使用 https://mcp.tavily.com/mcp/；鉴权按 Tavily 官方说明在你自己的 Dify 凭据弹窗填写。手册不保存密钥。","发现工具后，只在 W01 中选择 tavily_search。query 绑定 R01/topic；search_depth 填 basic；max_results 填 5；topic 填 general；图片、原文抓取和 favicon 等不需要的开关关闭。","W01 异常分支连 W00，自动重试关闭；W01b 解析实际 text/json，W01c 检查有真实 URL 的结果才进入 W02。","如果暂不配 MCP，可以先把 R03/web 连到 W00，完整核心学习闭环不依赖联网。后续配置好再按画布恢复 W01 路径。"],"fields":[["服务端点","https://mcp.tavily.com/mcp/"],["允许工具","tavily_search"],["search_depth / max_results","basic / 5"],["本轮次数","最多一次搜索，不重试"],["当前会话上限","10 次尝试，失败也计数"],["全局 300 次/月","此原生会话变量方案尚未实现；需共享存储与原子配额"]],"pm":"免费套餐不等于无限用，也不保证当期额度未耗尽。我让联网默认关闭，不把课程正文和学习档案发给搜索服务；外部结果独立标注且不参与课程评分。","check":"先看工具参数，再由你决定是否运行一次；普通课程问答不应触发 Tavily。"},{"id":"accept","title":"小步验收，记录真实产品决策","goal":"你自己操作复刻；本手册不执行 AI，不消耗模型额度。","steps":["先核对节点配置和连线，再用代码节点单步调试与自编样例检查结构。通过后只跑一条完整课程答疑，不急着批量运行。","问答检查实际来源支持与无答案处理；练习检查恰好三题、参考答案隐藏、审题最多修订一次；评分检查有效作答才写状态、重复提交不增殖。","Agent 检查真实工具轨迹；MCP 检查显式入口和失败降级；Memory 检查删除后后续上下文不再使用。模型 finish_reason=length 或 JSON 被截断时，先修输出预算/提示词，不能当成功。","每个关键选择记录：问题、证据、备选、理由、成本、风险、验证、实测结果、重评条件。先保留 5–10 个有代表性的失败案例，再扩大题集。","按相同题比较单教练与教练＋评估员的质量、延迟和 Token；120 条检索、40 条评分的人工金标及 7 天个人试用仍要真实完成，不能从画布推导。"],"fields":[["已验证的历史事实","877 父段索引可用；混合检索实际返回相关片段；17 项离线规则检查通过"],["已知线上失败","temperature 不兼容；900 输出上限导致 length 截断"],["本手册参数状态","已移除 temperature，增加输出预算；修正版完整闭环待你实测"],["Dify 与本地差异","GPU、RRF、严格单课过滤、长期数据库、全局配额、三栏 UI 均未完全复现"]],"pm":"我用这套作品展示需求拆解、边界、证据和迭代，而不只展示技术名词数量。课程机构付费与学习效果提升仍是商业假设。","check":"保留运行 ID、模型/提示词/知识库版本、耗时、Token 与失败原因；没配置单价只记 Token，不把 Dify UI 的 0 元当实际账单。"}],"sources":[["知识检索与两层召回设置","https://docs.dify.ai/zh/cloud/use-dify/nodes/knowledge-retrieval"],["经典 Agent 与 Function Calling","https://docs.dify.ai/zh/cloud/use-dify/nodes/agent"],["LLM 的上下文与结构化输出","https://docs.dify.ai/zh/cloud/use-dify/nodes/llm"],["会话变量的赋值与持久范围","https://docs.dify.ai/zh/cloud/use-dify/nodes/variable-assigner"],["代码执行节点","https://docs.dify.ai/zh/cloud/use-dify/nodes/code"],["Dify 工具集成","https://docs.dify.ai/zh/cloud/use-dify/tools"],["Tavily 官方 MCP","https://docs.tavily.com/documentation/mcp"]],"version":"2026-10-26 · 教学方案 v1","conversation":[{"name":"learning_state","type":"string","default":"{}"}]}</script>
<script>
(()=>{'use strict';
const D=JSON.parse(document.getElementById('guide-data').textContent), byId=Object.fromEntries(D.nodes.map(n=>[n.id,n]));
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const types={'start':'用户输入','end':'输出','llm':'LLM','agent':'经典 Agent','code':'代码执行','knowledge-retrieval':'知识检索','if-else':'条件分支','question-classifier':'问题分类器','assigner':'变量赋值器','variable-aggregator':'变量聚合器','answer':'直接回复','tool':'MCP 工具'};
const icons={'start':'↗','end':'↥','llm':'✦','agent':'A','code':'{ }','knowledge-retrieval':'▤','if-else':'⑂','question-classifier':'≡','assigner':'↧','variable-aggregator':'⋈','answer':'▣','tool':'⚒'};
const nodeName=id=>byId[id]?.data.title||id, shortName=id=>nodeName(id).replace(/^[A-Z0-9]+[a-z]?_/,'');
const pretty=x=>typeof x==='string'?x:JSON.stringify(x,null,2), STORAGE='course-dify-guide-v1';
let chapter='qa',selected='Q03',tab='settings',mode='canvas',prep='scope',done=new Set(),search='',scale=.8,pan={x:30,y:30},layout={},bounds={w:1,h:1},copies=[],visible=[],allEdges=[],drag=null,toastTimer;
try{const state=JSON.parse(localStorage.getItem(STORAGE)||'{}');done=new Set((state.done||[]).filter(id=>byId[id]));}catch{}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify({done:[...done]}));}catch{}}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function icon(kind){return `<span class="icon ${esc(kind)}">${icons[kind]||'◇'}</span>`;}
function labelHandle(e){if(e.handle==='fail-branch')return '异常分支';if(e.handle==='false')return 'ELSE';if(e.handle==='source')return '默认出口';const n=byId[e.source]?.data;if(n?.type==='question-classifier')return e.handle+' · '+(n.classes.find(c=>c.id===e.handle)?.name||'');return e.handle==='true'?'IF / yes':e.handle;}
function sourceLabel(a){if(!Array.isArray(a)||!a.length)return '未绑定';if(a[0]==='context')return '本节点 / 上下文 Context 标签';return (a[0]==='sys'?'系统变量':a[0]==='conversation'?'会话变量':nodeName(a[0]))+' / '+a.slice(1).join('.');}
function varRefs(text){return [...String(text||'').matchAll(/\{\{#([^#]+)#\}\}/g)].map(m=>({raw:m[0],path:m[1].split('.')}));}
function field(label,value,hint='',code=false){const id=copies.push(pretty(value))-1;return `<section class="block"><div class="field-label">${esc(label)}<button data-copy="${id}" aria-label="复制${esc(label)}">复制</button></div><div class="valuebox ${code?'codebox':''}"><pre>${esc(pretty(value))}</pre></div>${hint?`<p class="hint">${esc(hint)}</p>`:''}</section>`;}
function refButton(path){const id=path[0];return byId[id]?`<button data-select="${esc(id)}">${esc(sourceLabel(path))}</button>`:`<span class="chip">${esc(sourceLabel(path))}</span>`;}
function bindings(text){const refs=varRefs(text);if(!refs.length)return '';return `<p class="hint">复制文本后，在 Dify 输入框用“/”或变量选择器，把下面的占位表达式换为你自己节点的变量标签：</p>`+refs.map(r=>`<div class="binding"><code>${esc(r.raw)}</code>→ ${refButton(r.path)}</div>`).join('');}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}
function createSteps(n){const k=n.data.type;const location=k==='agent'?'选择“Agent”中的经典 Agent，再选 FunctionCalling 策略':`选择“${types[k]||k}”`;return `<h3>在 Dify 中怎么做</h3><ol class="step-list"><li>画布左侧“＋”添加节点，${esc(location)}。</li><li>把节点名称改为 <b>${esc(n.data.title)}</b>，便于后续选择变量。</li><li>逐项填写下面的设置；代码、提示词和 Schema 可复制。变量必须绑定到你自己画布上的对应输出。</li><li>在“连线”页按出口名称连接。连线决定执行顺序，变量绑定决定数据来自哪里。</li></ol>`;}
function modelFields(m){return field('模型',m.name||m.model||'kimi-k3','供应商选择你已配置的 OpenAI-API-compatible。')+field('模型参数',m.completion_params||{},'Kimi-k3 不传 temperature。max_tokens 是输出上限，需结合 finish_reason 调整；本手册不会调用模型。');}
function common(d){let h='';if(d.retry_config)h+=field('失败重试',d.retry_config,'retry_enabled=false：关闭自动重试。');if(d.error_strategy)h+=field('异常处理',d.error_strategy,'fail-branch：在界面选异常分支，再从异常出口连线，不能直接忽略错误。');return h;}
function settings(n){const d=n.data,k=d.type;let h=`<p>${esc(D.notes[n.id][0])}</p>`+createSteps(n);
if(k==='llm'){h+=modelFields(d.model);h+=field('Memory / 视觉',{Memory:'关闭',Vision:!!d.vision?.enabled});h+=field('上下文 Context',d.context?.enabled?sourceLabel(d.context.variable_selector):'关闭 / 不绑定',d.context?.enabled?'在 Context 下拉选择此 result；SYSTEM 中用上下文标签插入。正文只注入一次。':'这个节点需要的证据通过 USER 变量显式传入。');for(const p of d.prompt_template||[]){h+=field(p.role.toUpperCase()+' 提示词',p.text,'按角色添加消息，整段复制；变量还需在 Dify 替换。',true)+bindings(p.text);}h+=field('结构化输出',!!d.structured_output_enabled);if(d.structured_output_enabled)h+=field('JSON Schema',d.structured_output.schema,'在“结构化输出→JSON Schema”粘贴。对象由 structured_output 输出；模型非原生支持时更需检验格式。',true);}
else if(k==='agent'){h+=field('Agent 策略','经典 Agent / FunctionCalling','首次使用可从 Marketplace 的 Agent 策略安装平台官方策略。');h+=modelFields(d.agent_parameters.model.value);for(const [key,name]of[['maximum_iterations','最大迭代次数'],['instruction','指令 Instruction'],['query','查询 Query']]){const p=d.agent_parameters[key];if(p)h+=field(name,p.value,'参数绑定类型：'+p.type,true)+bindings(p.value);}h+=field('Memory','关闭');h+=field('工具列表',d.agent_parameters.tools.value,'只开放课程检索 Workflow 工具。query 在界面选择 Agent 自动生成；工作空间工具标识应重新选择。',true);}
else if(k==='code'){h+=table(['输入变量名','绑定来源','类型'],(d.variables||[]).map(v=>[`<code>${esc(v.variable)}</code>`,refButton(v.value_selector),esc(v.value_type||'按上游类型')]));h+=field('代码语言',d.code_language);h+=field('代码：整段复制',d.code,'函数参数名必须与上表的输入变量名完全一致。',true);h+=table(['输出变量名','类型'],Object.entries(d.outputs||{}).map(([key,v])=>[`<code>${esc(key)}</code>`,esc(v.type)]));}
else if(k==='knowledge-retrieval'){h+=field('查询文本',sourceLabel(d.query_variable_selector),'通过变量选择器绑定，不是填这段文字。');h+=field('知识库','Course_Learning_Full_qwen3_7_v1（选择你自己的完整课程库）','点击“添加知识库”，确认只选完整库。');h+=field('召回设置',{方式:'混合检索 / 权重设置',语义:.7,关键词:.3,Top_K:6,Score阈值:'关闭',模型rerank:'不启用'},'知识库级和节点级都要核对。权重模式需要高质量索引。');h+=field('元数据过滤','禁用','本教程全库检索。单文件 CSV 的课程编号在正文中，不等于文档元数据过滤。');}
else if(k==='question-classifier'){h+=modelFields(d.model);h+=field('输入变量',sourceLabel(d.query_variable_selector));h+=field('分类指令',d.instruction);h+=table(['分类 ID / 出口','分类描述'],d.classes.map(c=>[esc(c.id),esc(c.name)]));h+=field('视觉 / Memory','均关闭');}
else if(k==='if-else'){for(const c of d.cases){h+=`<h3>CASE ${esc(c.case_id)} · ${esc(c.logical_operator)}</h3>`+table(['变量','比较','目标值'],c.conditions.map(v=>[refButton(v.variable_selector),esc(v.comparison_operator),`<code>${esc(v.value||'（空）')}</code>`]));}h+='<p class="hint">is 对应“是”；not empty 对应“不为空”；字符串 yes/no 大小写须一致。其他情况走 ELSE。</p>';}
else if(k==='assigner'){h+=table(['写入目标','操作','值来源'],d.items.map(i=>[esc(sourceLabel(i.variable_selector)),esc(i.operation==='over-write'?'覆盖':i.operation),refButton(i.value)]));h+='<p class="hint">目标会话变量要先创建：learning_state，String，初始值 {}。</p>';}
else if(k==='variable-aggregator'){h+=field('输出类型',d.output_type);h+=table(['互斥输入','绑定来源'],d.variables.map((v,i)=>[String(i+1),refButton(v)]));h+='<p class="hint">输出字段是 output；取本轮实际执行的分支，不是把两个字符串拼接。</p>';}
else if(k==='answer'){h+=field('回复内容',d.answer,'用变量选择器插入上游输出，保留前后固定文案。',true)+bindings(d.answer);}
else if(k==='tool'){h+=field('工具提供方','Tavily 官方 MCP → tavily_search','先按搭建准备配置并发现 MCP 工具，不用 HTTP 请求节点冒充 MCP。');for(const [key,p]of Object.entries(d.tool_parameters||{}))h+=field(key,p.value,'参数模式：'+p.type)+bindings(p.value);h+='<p class="hint">其他可选参数保持默认；不启用高级搜索、抓取和付费备用服务。</p>';}
else if(k==='start'){h+=field('入口类型',n.id==='TS'?'Workflow 用户输入':'Chatflow 系统输入');if(n.id==='TS')h+=field('必填输入',{query:{type:'String',required:true}});else h+=field('当前消息','系统变量 / query','Chatflow 自动提供，不需要新增同名必填表单。');}
else if(k==='end'){h+=table(['输出字段','绑定来源'],(d.outputs||[]).map(v=>[esc(v.variable||v.name),refButton(v.value_selector)]));}
return h+common(d)+`<h3>复刻后怎么检查</h3><p>${esc(D.notes[n.id][2])}</p>`;}
function outputs(n){const d=n.data,k=d.type;if(k==='code')return Object.entries(d.outputs).map(([key,v])=>[key,v.type]);if(k==='llm')return [['text','String'],...(d.structured_output_enabled?[['structured_output','Object（按 Schema）']]:[]),['usage','Object（平台运行信息）']];if(k==='knowledge-retrieval')return [['result','Array[Object]，含 content / metadata / title 等']];if(k==='agent')return [['text','String，Agent 最终输出；其他轨迹看插件运行详情']];if(k==='variable-aggregator')return [['output',d.output_type]];if(k==='question-classifier')return [['类别分支','选择对应分类出口，后续不读自由文本']];if(k==='tool')return [['text','String'],['json','Array[Object]（由 MCP 插件返回形态决定）']];if(k==='start')return n.id==='TS'?[['query','String']]:[['sys.query','String，当前消息']];if(k==='end')return (d.outputs||[]).map(x=>[x.variable,'String']);if(k==='assigner')return [['conversation.learning_state','String，覆盖写入后供下轮使用']];return [['回复','展示上游结果，没有新的评分结论']];}
function collectBindings(d){const list=[];for(const v of d.variables||[]){if(Array.isArray(v))list.push({name:'聚合输入',path:v});else if(v.value_selector)list.push({name:v.variable,path:v.value_selector});}if(d.query_variable_selector)list.push({name:'查询文本',path:d.query_variable_selector});if(d.context?.enabled)list.push({name:'Context',path:d.context.variable_selector});for(const i of d.items||[])list.push({name:'写入值',path:i.value});for(const c of d.cases||[])for(const v of c.conditions)list.push({name:'判断条件',path:v.variable_selector});for(const v of Array.isArray(d.outputs)?d.outputs:[])if(v.value_selector)list.push({name:'输出 '+v.variable,path:v.value_selector});for(const r of varRefs(JSON.stringify(d)))list.push({name:r.raw,path:r.path});return list.filter((v,i,a)=>a.findIndex(x=>x.name===v.name&&x.path.join('.')===v.path.join('.'))===i);}
function io(n){const refs=collectBindings(n.data);return `<p>左侧是数据来自哪里，下面是本节点交给后续流程的字段。变量类型和字段名必须匹配。</p><h3>输入绑定</h3>`+(refs.length?table(['填写位置','选择来源'],refs.map(r=>[`<code>${esc(r.name)}</code>`,refButton(r.path)])):'<p class="muted">没有上游变量绑定；此处使用固定文案或系统入口。</p>')+`<h3>输出字段</h3>`+table(['字段','类型 / 含义'],outputs(n).map(r=>r.map(esc)))+`<div class="quiet-note">示例是字段结构，不是模型实测响应。对象转 JSON 字符串后仍是 String；不要把字符串直接绑定到 Array[Object]。</div>`;}
function connections(n){const ins=D.edges.filter(e=>e.target===n.id),outs=D.edges.filter(e=>e.source===n.id);return `<p>从左侧节点的指定出口，拖到右侧节点的输入端口。异常分支也有独立出口。</p><h3>进入本节点</h3>`+(ins.map(e=>`<div class="connect-row"><button data-select="${e.source}">${esc(nodeName(e.source))}</button><span>→ ${esc(labelHandle(e))}</span></div>`).join('')||'<p class="muted">流程起点。</p>')+`<h3>本节点向外连线</h3>`+(outs.map(e=>`<div class="connect-row"><span class="chip">${esc(labelHandle(e))}</span><span>→</span><button data-select="${e.target}">${esc(nodeName(e.target))}</button></div>`).join('')||'<p class="muted">该分支结束。</p>')+`<div class="quiet-note">画布线与输入变量需要同时配置。画布有线，不代表提示词里已拿到课程证据；字段绑定正确，也不意味着上游节点一定会执行。</div>`;}
function pm(n){const note=D.notes[n.id];const kind=n.data.type;const cost=['llm','agent','question-classifier'].includes(kind)?'本节点调用 LLM；Agent 迭代还可能追加模型与工具调用。先检查参数与输入，再由你决定运行。':kind==='knowledge-retrieval'?'本节点会调用云端 embedding 查询；模型 rerank 已省略，仍可能计 API 用量。':kind==='tool'?'本节点可能消耗 Tavily 搜索额度；只有明确 /联网 才可达。':'本节点是代码、状态或展示步骤，本手册阅读与点击不会调用任何模型。';return `<h3>它解决什么用户问题</h3><p>${esc(note[0])}</p><h3>我的产品决策</h3><p>${esc(note[1])}</p><h3>成本与约束</h3><p>${esc(cost)}</p><h3>验收证据</h3><p>${esc(note[2])}</p><h3>你可以记录的决策卡</h3>${field('复盘模板','问题：\n当前证据：\n备选方案：\n我的选择与理由：\n成本和风险：\n验证方法：\n实测结果（未做则写未执行）：\n再次评估条件：','用自己的实际结果填写，面试时解释取舍。',true)}<h3>能力边界</h3><p>同一聊天 Memory 不等于跨会话数据库；固定双角色不自动证明质量更好；有效引用 ID 不自动证明事实被原文支持。需要后续实验验证。</p>`;}
function inspector(){const n=byId[selected];copies=[];$('inspectTitle').innerHTML=icon(n.data.type)+`<div><h2>${esc(n.data.title)}</h2><div class="type">${esc(types[n.data.type])} · ${esc(n.id)}</div></div>`;document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));$('inspectBody').innerHTML=tab==='settings'?settings(n):tab==='io'?io(n):tab==='connections'?connections(n):tab==='pm'?pm(n):`<p class="hint">完整节点参数供查漏。知识库和 Workflow 工具的专属 ID 已替换；请在自己的工作空间重新选择。</p>`+field('节点完整参数',n.data,'参数来源：本地生成的教学方案；不是当前云端草稿的实时镜像。',true);$('inspectBody').scrollTop=0;$('done').checked=done.has(selected);const at=visible.findIndex(x=>x.id===selected);$('prev').disabled=at<=0;$('next').disabled=at<0||at>=visible.length-1;}
function summary(n){const d=n.data;switch(d.type){case'llm':return '✦ '+(d.model?.name||'kimi-k3')+(d.structured_output_enabled?' · JSON Schema':' · CHAT');case'agent':return 'FunctionCalling · search_course';case'knowledge-retrieval':return '▤ 完整课程库 · 混合权重';case'code':return 'Python3 · '+(d.variables||[]).length+' 个输入';case'question-classifier':return d.classes.map(c=>c.id).join(' / ');case'if-else':return d.cases.map(c=>c.case_id).join(' / ')+' / ELSE';case'assigner':return 'learning_state · 覆盖';case'variable-aggregator':return '互斥输出 → output';case'answer':return '回复 · '+d.answer.replace(/\{\{#.*?#\}\}/g,'变量');case'tool':return 'Tavily MCP · basic · 最多 5 条';case'start':return n.id==='TS'?'query · String · 必填':'sys.query · 当前消息';case'end':return 'evidence / source_ids';default:return types[d.type];}}
function drawLayout(){const idset=new Set(visible.map(n=>n.id));allEdges=D.edges.filter(e=>idset.has(e.source)&&idset.has(e.target));let indeg=Object.fromEntries(visible.map(n=>[n.id,0])),rank=Object.fromEntries(visible.map(n=>[n.id,0]));allEdges.forEach(e=>indeg[e.target]++);let queue=visible.filter(n=>!indeg[n.id]).map(n=>n.id),seen=0;while(queue.length){const id=queue.shift();seen++;for(const e of allEdges.filter(e=>e.source===id)){rank[e.target]=Math.max(rank[e.target],rank[id]+1);if(--indeg[e.target]===0)queue.push(e.target);}}if(seen!==visible.length)throw Error('教学图存在环，请检查连线');let layers={};visible.forEach(n=>(layers[rank[n.id]]??=[]).push(n));let maxRows=Math.max(...Object.values(layers).map(a=>a.length));layout={};for(const [r,ns]of Object.entries(layers)){ns.sort((a,b)=>a.originalY-b.originalY);ns.forEach((n,j)=>layout[n.id]={x:50+Number(r)*310,y:50+j*170+(maxRows-ns.length)*85});}bounds={w:Math.max(...Object.values(layout).map(p=>p.x))+290,h:Math.max(...Object.values(layout).map(p=>p.y))+175};$('world').style.width=bounds.w+'px';$('world').style.height=bounds.h+'px';$('edges').setAttribute('width',bounds.w);$('edges').setAttribute('height',bounds.h);}
function drawGraph(){const visibleEdges=allEdges.filter(e=>$('failures').checked||e.handle!=='fail-branch');$('edges').innerHTML=`<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="context-stroke"/></marker></defs>`+visibleEdges.map(e=>{const a=layout[e.source],b=layout[e.target],handles=[...new Set(allEdges.filter(x=>x.source===e.source).map(x=>x.handle))],idx=handles.indexOf(e.handle),y=a.y+62+(idx-(handles.length-1)/2)*17,x=a.x+240,tx=b.x,ty=b.y+62,c=Math.max(35,(tx-x)*.5),related=e.source===selected||e.target===selected;return `<g><path class="edge ${e.handle==='fail-branch'?'failure':''} ${related?'related':'dim'}" d="M ${x} ${y} C ${x+c} ${y},${tx-c} ${ty},${tx} ${ty}" marker-end="url(#arr)"/><text class="edge-label" x="${x+9}" y="${y-7}">${esc(e.handle==='source'?'':e.handle==='fail-branch'?'异常':e.handle==='false'?'ELSE':e.handle)}</text></g>`;}).join('');$('nodes').innerHTML=visible.map(n=>{const p=layout[n.id];return `<button class="canvas-node ${n.id===selected?'selected':''}" style="left:${p.x}px;top:${p.y}px" data-select="${esc(n.id)}" aria-label="查看 ${esc(n.data.title)} 的配置" aria-pressed="${n.id===selected}">${done.has(n.id)?'<span class="node-check">✓</span>':''}<span class="node-top">${icon(n.data.type)}<span class="node-name">${esc(n.data.title)}</span></span><div class="node-summary">${esc(summary(n))}</div><div class="node-purpose">${esc(D.notes[n.id][0])}</div></button>`;}).join('');applyTransform();}
function applyTransform(){$('world').style.transform=`translate(${pan.x}px,${pan.y}px) scale(${scale})`;$('zoomLabel').textContent=Math.round(scale*100)+'%';}
function center(id){const p=layout[id];if(!p)return;const r=$('viewport').getBoundingClientRect();pan={x:r.width/2-(p.x+120)*scale,y:r.height/2-(p.y+62)*scale};applyTransform();}
function fit(){const r=$('viewport').getBoundingClientRect();scale=Math.max(.05,Math.min(1,(r.width-40)/bounds.w,(r.height-40)/bounds.h));pan={x:(r.width-bounds.w*scale)/2,y:(r.height-bounds.h*scale)/2};applyTransform();}
function zoom(f,point){const r=$('viewport').getBoundingClientRect();const p=point||{x:r.width/2,y:r.height/2},old=scale;scale=Math.max(.05,Math.min(1.5,scale*f));pan={x:p.x-(p.x-pan.x)*scale/old,y:p.y-(p.y-pan.y)*scale/old};applyTransform();}
function updateProgress(){$('progress').textContent=`已标记 ${done.size} / 68 个节点 · 仅保存在本机`;}
function renderList(){const list=search?D.nodes.filter(n=>(n.id+' '+n.data.title+' '+types[n.data.type]).toLowerCase().includes(search.toLowerCase())):visible;$('nodeList').innerHTML=list.length?list.map(n=>`<button data-select="${n.id}" class="${n.id===selected?'active ':''}${done.has(n.id)?'done':''}"><span class="dot"></span><span class="label">${esc(n.data.title)}</span></button>`).join(''):'<p class="empty">没有找到节点。试试 Q03、评估或检索。</p>';updateProgress();}
function selectNode(id){if(!byId[id])return;if(mode!=='canvas'){mode='canvas';chapter=id.startsWith('T')?'tool':'all';renderCanvas();}if(!visible.some(n=>n.id===id)){chapter=id.startsWith('T')?'tool':'all';renderCanvas();}selected=id;drawGraph();renderList();inspector();center(id);}
function renderNav(){$('canvasMode').classList.toggle('active',mode==='canvas');$('prepMode').classList.toggle('active',mode==='prep');$('chapters').innerHTML=mode==='canvas'?D.chapters.map(c=>`<button data-chapter="${c.id}" class="${chapter===c.id?'active':''}">${esc(c.title)}<small>${c.id==='all'?64:c.ids.length}</small></button>`).join(''):D.prep.map(p=>`<button data-prep="${p.id}" class="${prep===p.id?'active':''}">${esc(p.title)}</button>`).join('');}
function renderCanvas(){mode='canvas';$('shell').classList.remove('reading');$('stage').innerHTML=canvasMarkup;wireCanvas();const c=D.chapters.find(c=>c.id===chapter),ids=c.id==='all'?D.nodes.filter(n=>!n.id.startsWith('T')).map(n=>n.id):c.ids;visible=ids.map(id=>byId[id]);if(!ids.includes(selected))selected=c.focus;renderNav();$('chapterTitle').textContent=c.title;$('chapterSubtitle').textContent=c.subtitle;$('decision').innerHTML='<b>产品决策</b>　'+esc(c.decision);drawLayout();$('count').textContent=`${visible.length} 节点 · ${allEdges.length} 连线`;drawGraph();renderList();inspector();requestAnimationFrame(()=>{if(chapter==='all'||chapter==='tool')fit();else{scale=.9;center(selected);}});}
function renderPrep(){mode='prep';$('shell').classList.add('reading');renderNav();const p=D.prep.find(p=>p.id===prep);copies=[];$('nodeList').innerHTML='';$('stage').innerHTML=`<div class="stage-head"><div class="row"><h2>搭建前准备 / ${esc(p.title)}</h2><span class="chip">离线教学</span></div><p>页面名称依据 2026-10-25 实际观察与 2026-10-26 官方说明；Cloud 界面可能更新。</p></div><article class="reading-content"><h1>${esc(p.title)}</h1><p>${esc(p.goal)}</p><h2>点哪里、填什么</h2><ol class="step-list">${p.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><h2>填写对照</h2>${table(['参数 / 决策点','填写内容'],p.fields.map(r=>[esc(r[0]),`<pre>${esc(r[1])}</pre>`]))}<h2>AI 产品经理的思考</h2><p>${esc(p.pm)}</p><h2>怎样判断做对了</h2><p>${esc(p.check)}</p><div class="quiet-note">此手册是独立的可交互文档，不连接 Dify、不读取密钥、不调用 AI。节点参数是建议搭建配置；当前云端草稿可能与本手册不同。</div><h2>官方说明与项目材料</h2><div class="sources">${D.sources.map(s=>`<a href="${esc(s[1])}" target="_blank" rel="noopener noreferrer">${esc(s[0])} ↗</a>`).join('')}<a href="../完整实操讲义.md">完整实操讲义（本地 Markdown）</a><a href="逐节点参数手册.md">逐节点参数手册（本地 Markdown）</a></div><button class="primary" id="backCanvas">进入节点画布 →</button></article>`;$('backCanvas').onclick=()=>{chapter=p.id==='toolsetup'?'tool':p.id==='mcp'?'web':'qa';renderCanvas();};updateProgress();}
function wireCanvas(){$('zoomIn').onclick=()=>zoom(1.2);$('zoomOut').onclick=()=>zoom(1/1.2);$('fit').onclick=fit;$('actual').onclick=()=>{scale=1;center(selected);};$('locate').onclick=()=>center(selected);$('failures').onchange=drawGraph;const v=$('viewport');v.addEventListener('wheel',e=>{e.preventDefault();const r=v.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0015),{x:e.clientX-r.left,y:e.clientY-r.top});},{passive:false});v.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag={x:e.clientX,y:e.clientY,px:pan.x,py:pan.y};v.setPointerCapture(e.pointerId);});v.addEventListener('pointermove',e=>{if(!drag)return;pan={x:drag.px+e.clientX-drag.x,y:drag.py+e.clientY-drag.y};applyTransform();});const end=()=>drag=null;v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);}
const canvasMarkup=$('stage').innerHTML;
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.select)selectNode(b.dataset.select);else if(b.dataset.chapter){chapter=b.dataset.chapter;search='';$('search').value='';renderCanvas();}else if(b.dataset.prep){prep=b.dataset.prep;renderPrep();}else if(b.dataset.tab){tab=b.dataset.tab;inspector();}else if(b.dataset.copy!==undefined){const text=copies[Number(b.dataset.copy)];try{await navigator.clipboard.writeText(text);toast('已复制；Dify 变量需用选择器重新绑定');}catch{const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();toast(ok?'已复制':'复制受浏览器限制，请选中文本后手动复制');}}});
$('search').addEventListener('input',e=>{search=e.target.value;renderList();});$('canvasMode').onclick=()=>renderCanvas();$('prepMode').onclick=()=>renderPrep();$('startGuide').onclick=()=>{prep='scope';renderPrep();};$('print').onclick=()=>window.print();$('done').onchange=e=>{e.target.checked?done.add(selected):done.delete(selected);save();renderList();drawGraph();};$('prev').onclick=()=>{const i=visible.findIndex(n=>n.id===selected);if(i>0)selectNode(visible[i-1].id);};$('next').onclick=()=>{const i=visible.findIndex(n=>n.id===selected);if(i<visible.length-1)selectNode(visible[i+1].id);};$('version').textContent=D.version;window.addEventListener('resize',()=>{if(mode==='canvas')applyTransform();});renderCanvas();
})();
</script>
</body></html>

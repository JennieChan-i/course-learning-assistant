openapi: 3.0.3
info:
  title: Course Learning Read Tools - Proposed Dify Bridge
  version: 0.1.0-draft
  description: >-
    Reference contract, NOT implemented by the current backend.
    Only register these read/search operations as Agent tools.
    run_ticket is bound manually by the workflow; the backend fixes course and permissions.
servers:
  - url: http://host.docker.internal:8770
security:
  - bridgeToken: []
paths:
  /bridge/tools/search-course:
    post:
      operationId: search_course
      summary: Identify the learning intent and retrieve evidence within the server-fixed course scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_ticket, query]
              properties:
                run_ticket:
                  $ref: '#/components/schemas/RunTicket'
                query:
                  type: string
                  minLength: 1
                  maxLength: 600
                intent:
                  type: string
                  default: explain
                  enum: [explain, compare, example, practice, review, current, clarify]
                clarification:
                  type: string
                  maxLength: 500
      responses:
        '200':
          $ref: '#/components/responses/Evidence'
        '403':
          description: Invalid ticket, scope or permission
  /bridge/tools/get-source:
    post:
      operationId: get_source
      summary: Read a known source within the server-fixed course scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_ticket, source_id]
              properties:
                run_ticket:
                  $ref: '#/components/schemas/RunTicket'
                source_id:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        '200':
          $ref: '#/components/responses/Evidence'
        '403':
          description: Invalid ticket or source outside the fixed scope
  /bridge/tools/search-web:
    post:
      operationId: search_web
      summary: Search through the real Tavily MCP client only when this run explicitly permits it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [run_ticket, query]
              properties:
                run_ticket:
                  $ref: '#/components/schemas/RunTicket'
                query:
                  type: string
                  minLength: 1
                  maxLength: 160
                include_domains:
                  type: array
                  maxItems: 5
                  items:
                    type: string
                    maxLength: 253
                    pattern: '^(?:[A-Za-z0-9-]+\.)+[A-Za-z]{2,63}$'
      responses:
        '200':
          $ref: '#/components/responses/Evidence'
        '403':
          description: Web is disabled, the run is cancelled, or a search was already attempted
components:
  securitySchemes:
    bridgeToken:
      type: http
      scheme: bearer
  schemas:
    RunTicket:
      type: string
      minLength: 16
      maxLength: 128
      description: Short-lived opaque run capability supplied by the backend, never generated by the model
    Source:
      type: object
      required: [id, type, title, text]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [course, web]
        title:
          type: string
        text:
          type: string
        url:
          type: string
        version:
          type: string
    EvidenceResult:
      type: object
      required: [status, sources, warning]
      properties:
        status:
          type: string
          enum: [ok, clarify, unavailable]
        sources:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/Source'
        warning:
          type: string
        clarification:
          type: string
  responses:
    Evidence:
      description: Bounded evidence; returned IDs and excerpt hashes must also be recorded server-side
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EvidenceResult'

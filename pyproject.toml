[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "course-learning-assistant"
version = "0.1.0"
description = "Evidence-grounded course learning, practice and review"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1", "openai>=1.70,<3", "langgraph>=0.6,<2",
  "mcp>=1.12,<2", "qdrant-client>=1.14,<2", "jieba==0.42.1",
  "rank-bm25==0.2.2", "numpy>=1.26,<3", "transformers>=4.51,<5",
  "huggingface-hub>=0.30,<1", "safetensors>=0.5,<1", "tzdata>=2025.1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1"]

[project.scripts]
course-assistant = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
